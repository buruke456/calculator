function convertLength(length, from ,to){
if (((from ==='miles') || (from === 'km') || (from === 'feet'))  &&((to === 'miles') || (to === 'km') || (to === 'feet'))){
if(from === 'miles'){
if(to=== 'km'){
  const km =length*1.6;
console.log(`convertLength(${length}, '${from}','${to}') => '${km}${to}'`)
}
  else if(to === 'feet'){
  const feet = length*5280;
  console.log(`convertLength(${length}, '${from}','${to}') => '${feet}${to}'`);
}  
else if (to ==='miles'){
  console.log(`convertLength(${length},'${from}','${to}) =>'${length}${to}'`);
}
}
else if(from==='km'){
if(to==='miles'){
  const miles = length/1.6;
  console.log(`convertLength(${length}, '${from}','${to}') => '${miles}${to}'`);
}
  else if(to === 'feet'){
  const feet = length*3281;
  console.log(`convertLength(${length}, '${from}','${to}') => '${feet}${to}'`);
}  
else if(to==='km'){
console.log(`convertLength(${length},'${from}','${to}') =>'${length}${to}'`); 
} 
}
else if(from === 'feet'){
if(to === 'miles'){
const miles = length/5280;
console.log(`convertLength('${length}','${from}','${to}') => '${miles}${to}' `) 
}
else if(to==='km'){
const km = length/3281;
console.log(`convertLength('${length}','${from}','${to}') =>'${km}${to}' `);
}
else if(to==='feet'){
console.log(`convertLength('${length}','${from}','${to}') =>'${length}${to}' `);
}
}
}
else  {
console.log('invalid unit');
}
}
